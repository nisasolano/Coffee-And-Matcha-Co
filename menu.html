<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Coffee & Matcha Co</title>
    <link rel="stylesheet" href="styles.css">

<body>
    <nav class="navbar">

                <li><a href="menu.html" class="active">Menu</a></li>
